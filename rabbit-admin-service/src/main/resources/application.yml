server:
  port: 8084

spring:
  application:
    name: rabbit-admin-service

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health