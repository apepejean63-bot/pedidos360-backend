version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos360
    ports:
      - "3307:3306"
    volumes:
      - pedidos360-mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pedidos360-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - pedidos360-rabbitmq-data:/var/lib/rabbitmq

volumes:
  pedidos360-mysql-data:
  pedidos360-rabbitmq-data:
