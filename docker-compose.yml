version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedidos360
    ports:
      - "3307:3306"
    volumes:
      - pedidos360-mysql-data:/var/lib/mysql

volumes:
  pedidos360-mysql-data:
