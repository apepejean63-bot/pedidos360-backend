server:
  port: 8081

spring:
  application:
    name: pedidos-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pedidos360}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # IMPORTANTE: reemplazar AZURE_TENANT_ID por el Tenant ID real una vez que
          # tengan el registro en Azure AD / Microsoft Entra ID.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys

# Client ID de la app "Pedidos360-API" registrada en Azure AD.
# Se usa para validar el "audience" del token (evita que tokens de otras apps sean aceptados aqui).
azure:
  client-id: ${AZURE_CLIENT_ID_BACKEND}

management:
  endpoints:
    web:
      exposure:
        include: health
